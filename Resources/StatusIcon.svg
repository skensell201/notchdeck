<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="18" height="18">
  <!-- NotchDeck menu bar icon: the app icon's notch and fanned cards, cut down
       to one colour. The app loads it as a template, so only alpha matters and
       the menu bar tints it. Render with Scripts/make-icon.sh. -->
  <defs>
    <!-- Punches a gap around the front card so the cards behind it stay
         readable as separate shapes in a single colour. -->
    <mask id="behind">
      <rect width="18" height="18" fill="#fff"/>
      <rect x="5.3" y="5.2" width="7.4" height="11.6" rx="2.2" fill="#000"/>
    </mask>
  </defs>
  <path d="M2.5 0 H15.5 V0.9 A2 2 0 0 1 13.5 2.9 H4.5 A2 2 0 0 1 2.5 0.9 Z"/>
  <g mask="url(#behind)">
    <rect x="6.5" y="7" width="5" height="9" rx="1.3" transform="rotate(-19 9 25)"/>
    <rect x="6.5" y="7" width="5" height="9" rx="1.3" transform="rotate(19 9 25)"/>
  </g>
  <rect x="6.4" y="6.3" width="5.2" height="9.4" rx="1.4"/>
</svg>
